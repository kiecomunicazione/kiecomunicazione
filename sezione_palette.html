<!--
  Modello riutilizzabile "sezione_palette"
  Copia il blocco <section> dentro il <div class="container narrow project-body …"> della pagina progetto.
  Sostituisci: id univoco, testi, classi swatch e aria-label.
-->
<section class="sezione_palette" aria-labelledby="esempio-palette-id">
  <h1 class="project-body-heading" id="esempio-palette-id">Palette cromatica</h1>
  <div
    class="project-palette-swatches"
    role="img"
    aria-label="Descrizione accessibile dei colori mostrati"
  >
    <span class="project-palette-swatch project-palette-swatch--white"></span>
    <span class="project-palette-swatch project-palette-swatch--bibigula-orange"></span>
    <span class="project-palette-swatch project-palette-swatch--bibigula-blue"></span>
  </div>
  <p>Testo descrittivo della palette del brand.</p>
</section>
